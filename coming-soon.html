<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomima — a new site is on the way</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <!-- One descriptive sentence on purpose: this page is served at nomima.io/, so it
       stays the homepage in search results while the real landing page is reworked. -->
  <meta name="description" content="Nomima is a private, local-first knowledge base for macOS. Our new site is on the way." />
  <link rel="canonical" href="https://nomima.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nomima" />
  <meta property="og:title" content="Nomima — a new site is on the way" />
  <meta property="og:description" content="The private, local-first knowledge base for macOS. A new site is on the way." />
  <meta property="og:url" content="https://nomima.io/" />
  <meta property="og:image" content="https://nomima.io/og.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --bg: #0a0b10;
      --fg: #eef0f6;
      --muted: #9aa0b0;
      --accent: #6c6cff;
      --pink: #f048a8;
      --border: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem 1.5rem; text-align: center; overflow-x: clip;
    }
    /* Same two-lobe accent glow as the real hero, so this still reads as Nomima. */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(700px 380px at 50% 22%, rgba(108,108,255,.20), transparent 70%),
        radial-gradient(560px 320px at 76% 70%, rgba(240,72,168,.12), transparent 70%);
    }
    a { color: inherit; }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-weight: 700; letter-spacing: -.02em; font-size: 19px; margin-bottom: 30px;
    }
    .brand img { width: 30px; height: 30px; filter: drop-shadow(0 2px 12px rgba(108,108,255,.5)); }

    h1 {
      font-size: clamp(29px, 6vw, 42px); line-height: 1.12; letter-spacing: -.03em;
      font-weight: 800; margin: 0 0 16px; max-width: 20em; text-wrap: balance;
    }
    .grad {
      background: linear-gradient(100deg, var(--accent), var(--pink));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p {
      color: var(--muted); font-size: 16.5px; margin: 0; max-width: 26rem;
      text-wrap: pretty;
    }
    .contact {
      margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--border);
      font-size: 14px; color: var(--muted); max-width: 30rem; text-wrap: balance;
    }
    .contact a { color: var(--fg); text-decoration: none; border-bottom: 1px solid rgba(108,108,255,.55); }
    .contact a:hover { border-bottom-color: var(--fg); }
  </style>
</head>
<body>
  <span class="brand"><img src="/logo.svg" alt="" /> Nomima</span>

  <h1>A new site is <span class="grad">on the way.</span></h1>

  <p>The private, local-first knowledge base for macOS. We're rebuilding this page — back shortly.</p>

  <!-- /get redirects expired or invalid download links to /?link=…, which used to land
       on the capture form. With no form here, this line is what keeps those visitors
       (and existing users) from hitting a dead end. -->
  <p class="contact">
    Already using Nomima, or need a download link?
    <a href="mailto:hello@nomima.io">hello@nomima.io</a>
  </p>
</body>
</html>
